<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a class="brand" aria-label="Blinkit home">
                <img src="assets/download.jpg" alt="Blinkit">
            </a>

            <div class="delivery-location">
                <strong>Delivery in 8 minutes</strong>
                <span>New Delhi, India <span class="chevron"></span></span>
            </div>

            <form class="search" role="search">
                <span class="search-icon" aria-hidden="true"></span>
                <input type="search" placeholder="Search for products..." aria-label="Search for products">
            </form>

            <a class="login-link" >Login</a>
            <a class="cart-button">
                <span class="cart-icon">🛒</span>
                <span>My Cart</span>
            </a>
        </div>
    </header>

    <main>
        <div class="main-banner">
            <img src="assets/main-banner.webp" alt="">
        </div>

        <section class="promotions">
            <div class="promotion-grid">
                <div class="promotion-card">
                    <img src="assets/pharmacy-WEB.avif" alt="">
                </div>
                <div class="promotion-card">
                    <img src="assets/baby_crystal_WEB-1.avif" alt="">
                </div>
                <div class="promotion-card">
                    <img src="assets/pet_crystal_WEB-1.avif" alt="">
                </div>
            </div>
        </section>
        <div class="category-items">
            <div class="card">
                <img src="assets/c1.jpg">
                <span>Vegetables & Fruits</span>
                
            </div>
            <div class="card">
                <img src="assets/c2.jpg">
               <span>Atta, Rice and Dal</span>
            </div>
            <div class="card">
              <img src="assets/c3.jpg">
               <span>Bread and Eggs</span>
            </div>
            <div class="card">
                <img src="assets/c4.jpg">
                <span>Bakery and Biscuits</span>
            </div>
            <div class="card">
                <img src="assets/c5.jpg">
                Chips and Namkeen
            </div>
            <div class="card">
                <img src="assets/c6.jpg">
                <span>Sweets and Chocolates</span>
            </div>
            <div class="card">
                <img src="assets/c7.jpg">
              <span>Drinks and Juices</span>
            </div>
            <div class="card">
                <img src="assets/c8.jpg">
                <span>Bath and Body</span>
            </div>
            <div class="card">
                <img src="assets/c9.jpg">
               <span>Haircare</span>
            </div>
            <div class="card">
                <img src="assets/c10.jpg">
                <span>Skin and Face</span>
            </div>
        </div>
    </main>
</body>
</html>
