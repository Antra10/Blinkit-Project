<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blinkit Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <a class="brand" href="#" aria-label="Blinkit home">
                <img src="assets/logo.webp" alt="Blinkit">
            </a>

            <div class="delivery-location">
                <strong>Delivery in 8 minutes</strong>
                <span>New Delhi, India <span class="chevron" aria-hidden="true"></span></span>
            </div>

            <form class="search" role="search">
                <span class="search-icon" aria-hidden="true"></span>
                <input type="search" placeholder="Search for products..." aria-label="Search for products">
            </form>

            <a class="login-link" href="#">Login</a>
            <a class="cart-button" href="#" aria-label="Your cart">
                <span class="cart-icon" aria-hidden="true">🛒</span>
                <span>My Cart</span>
            </a>
        </div>
    </header>

    <main>
        <div class="main-banner">
            <img src="assets/main-banner.webp" alt="Stock up on daily essentials. Get farm-fresh fruits, vegetables, eggs and more.">
        </div>
    </main>
</body>
</html>
